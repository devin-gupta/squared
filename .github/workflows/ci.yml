name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only placeholders. CI never connects to production or deploys its
      # artifact; Vercel rebuilds with its own environment and server-only secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests and production build
        run: npm run check
      - name: Install browsers for mobile and real service worker checks
        run: npx playwright install --with-deps webkit chromium
      - name: Check invitation, drafts, undo and sharing in a mobile browser
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/squared-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e 'async function ready(){for(let i=0;i<30;i++){try{if((await fetch("http://127.0.0.1:3000")).ok)return}catch{} await new Promise(r=>setTimeout(r,500))}process.exit(1)}ready()'
          npm run test:browser
